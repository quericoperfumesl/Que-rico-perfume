<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D1A86">
<title>Que Rico Perfume</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&family=Urbanist:wght@500;600;700;800&display=swap">
<style>
/* Layout: panel flotante a la izquierda (compu) o barra inferior (celu) + grilla de tarjetas blancas sobre fondo lavanda con manchas de color */
:root{
  --bg:#F2F1F8; --blob-a:#DDE2FF; --blob-b:#FBF0CF; --blob-c:#F7E6F0;
  --card:#FFFFFF; --card-2:#F7F5FD; --glass:rgba(255,255,255,.72);
  --ink:#1A1730; --ink-2:#4A4664; --mute:#8C88A4; --line:#E8E4F4;
  --acc:#1B2BB5; --acc-2:#5F6FF2; --acc-soft:#E7EAFF; --acc-txt:#1626A3; --on-acc:#FFFFFF; --navy:#0D1A86; --cream:#F9EBAF; --cream-ink:#0D1A86; --logo-fx:none;
  --ok:#0F8A5D; --ok-soft:#DFF4EA; --bad:#C93670; --bad-soft:#FCE6EE;
  --warn:#9E6208; --warn-soft:#FFF0D6; --info:#2B63CC; --info-soft:#E3ECFF;
  --shadow:0 1px 2px rgba(45,32,110,.04),0 10px 28px rgba(45,32,110,.07);
  --f-disp:'Urbanist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Lexend',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --r-l:26px; --r-m:18px; --r-s:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F0F18; --blob-a:#1A2050; --blob-b:#2E2914; --blob-c:#2A1426;
  --card:#1A1727; --card-2:#221E32; --glass:rgba(26,23,39,.78);
  --ink:#EFECFB; --ink-2:#C6C2DC; --mute:#9893B2; --line:#2D2942;
  --acc:#6F7DFF; --acc-2:#9AA6FF; --acc-soft:#1E2452; --acc-txt:#B3BCFF; --on-acc:#FFFFFF; --navy:#16217A; --cream:#F9EBAF; --cream-ink:#0D1A86; --logo-fx:brightness(0) invert(1);
  --ok:#41D29C; --ok-soft:#113426; --bad:#FF7DAA; --bad-soft:#3B1627;
  --warn:#F3B651; --warn-soft:#382811; --info:#86ADFF; --info-soft:#172649;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.28); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F0F18; --blob-a:#1A2050; --blob-b:#2E2914; --blob-c:#2A1426;
  --card:#1A1727; --card-2:#221E32; --glass:rgba(26,23,39,.78);
  --ink:#EFECFB; --ink-2:#C6C2DC; --mute:#9893B2; --line:#2D2942;
  --acc:#6F7DFF; --acc-2:#9AA6FF; --acc-soft:#1E2452; --acc-txt:#B3BCFF; --on-acc:#FFFFFF; --navy:#16217A; --cream:#F9EBAF; --cream-ink:#0D1A86; --logo-fx:brightness(0) invert(1);
  --ok:#41D29C; --ok-soft:#113426; --bad:#FF7DAA; --bad-soft:#3B1627;
  --warn:#F3B651; --warn-soft:#382811; --info:#86ADFF; --info-soft:#172649;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.28); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--f-body);font-size:14px;font-weight:400;line-height:1.45;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.blobs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.blobs i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.9}
.blobs i:nth-child(1){width:520px;height:520px;background:var(--blob-a);top:-160px;left:-120px}
.blobs i:nth-child(2){width:460px;height:460px;background:var(--blob-b);bottom:-180px;right:-120px}
.blobs i:nth-child(3){width:360px;height:360px;background:var(--blob-c);top:30%;right:22%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-disp);margin:0;text-wrap:balance;letter-spacing:-.01em}

/* ---------- estructura ---------- */
.app{position:relative;z-index:1;display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;padding:20px 0 20px 20px;display:flex}
.side-in{flex:1;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:var(--r-l);padding:22px 14px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px;padding:2px 10px 18px}
.logo{display:grid;place-items:center;padding:6px 10px 18px}
.logo img{width:140px;height:auto;display:block;filter:var(--logo-fx)}
.mlogo{display:grid;place-items:center}
.mlogo img{height:46px;width:auto;display:block;filter:var(--logo-fx)}
.brand-mark{width:36px;height:36px;border-radius:12px;background:linear-gradient(140deg,var(--acc),var(--acc-2));display:grid;place-items:center;color:var(--on-acc)}
.brand b{font-family:var(--f-disp);font-size:22px;font-weight:800;letter-spacing:-.02em}
.brand b em{font-style:normal;color:var(--acc)}
.nav{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;color:var(--ink-2);font-weight:400;text-decoration:none;transition:background .15s,color .15s}
.nav svg{width:20px;height:20px;flex:none}
.nav:hover{background:var(--card-2);color:var(--ink)}
.nav[aria-current="page"]{background:var(--acc);color:var(--on-acc);font-weight:500;box-shadow:0 8px 18px -8px var(--acc)}
.side-sp{flex:1}
.side-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:14px;display:grid;gap:8px}
.side-card small{color:var(--mute);font-size:11.5px}
.main{min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
@media (min-width:900px){.main{padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));padding-block:26px 48px}}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.top-t{flex:1;min-width:0}
.top-t h1{font-size:30px;font-weight:700;line-height:1.1}
.top-t h1 span{color:var(--mute);font-weight:600}
.top-t p{margin:4px 0 0;color:var(--mute);font-size:13px}
.top-r{display:flex;align-items:center;gap:8px}
.mbrand{display:none}
.bnav{display:none}

/* ---------- piezas comunes ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);padding:20px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-h h3{font-size:17px;font-weight:700;flex:1}
.card-h small{color:var(--mute);font-size:12px;display:block;font-family:var(--f-body);font-weight:400}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--ink-2);flex:none;text-decoration:none}
.iconbtn:hover{color:var(--acc);border-color:var(--acc-soft)}
.iconbtn svg{width:18px;height:18px}
.iconbtn.sm{width:34px;height:34px}
.iconbtn.sm svg{width:16px;height:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:999px;font-weight:500;background:var(--acc);color:var(--on-acc);box-shadow:0 8px 18px -10px var(--acc);white-space:nowrap;text-decoration:none}
.btn svg{width:18px;height:18px}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.soft{background:var(--acc-soft);color:var(--acc-txt);box-shadow:none}
.btn.ok{background:var(--ok);color:var(--on-acc);box-shadow:none}
.btn.danger{background:var(--bad-soft);color:var(--bad);box-shadow:none}
.btn.sm{height:34px;padding:0 13px;font-size:13px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.status{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:12.5px;color:var(--ink-2)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.status.busy i{background:var(--warn);box-shadow:0 0 0 3px var(--warn-soft);animation:pulse 1s infinite}
.status.err i{background:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
.status.demo i{background:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
@keyframes pulse{50%{opacity:.35}}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:11.5px;font-weight:500;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.nodot::before{display:none}
.t-acc{background:var(--acc-soft);color:var(--acc-txt)}
.t-ok{background:var(--ok-soft);color:var(--ok)}
.t-bad{background:var(--bad-soft);color:var(--bad)}
.t-warn{background:var(--warn-soft);color:var(--warn)}
.t-info{background:var(--info-soft);color:var(--info)}
.t-mute{background:var(--card-2);color:var(--mute)}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:14px;flex:none}
.av.lg{width:56px;height:56px;font-size:20px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap;font-size:13px}
.chip b{font-weight:500;color:var(--mute);font-size:12px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] b{color:inherit;opacity:.7}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--card-2);border:1px solid var(--line)}
.seg button{height:30px;padding:0 13px;border-radius:999px;font-size:12.5px;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--on-acc)}
.in,.sel{width:100%;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--card-2);padding:0 14px;font-size:15px;outline:none;min-width:0}
.in:focus,.sel:focus{border-color:var(--acc);background:var(--card)}
textarea.in{height:auto;min-height:88px;padding:12px 14px;resize:vertical}
.search{position:relative;flex:1;min-width:200px}
.search svg{position:absolute;left:14px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--mute)}
.search .in{padding-left:42px;background:var(--card);border-radius:999px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.lbl{display:block;font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-bottom:7px}
.field{display:grid;gap:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.muted{color:var(--mute)}
.empty{padding:26px 10px;text-align:center;color:var(--mute);font-size:13px}
.banner{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:linear-gradient(120deg,var(--acc-soft),var(--card));border:1px solid var(--line);border-radius:var(--r-m);padding:14px 16px;margin-bottom:18px}
.banner p{margin:0;flex:1;min-width:200px;color:var(--ink-2);font-size:13.5px}
.banner b{color:var(--ink)}

/* ---------- inicio ---------- */
.dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px}
.s4{grid-column:span 4}.s6{grid-column:span 6}.s8{grid-column:span 8}.s12{grid-column:span 12}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.filters .sel{width:auto;height:40px;border-radius:999px;background:var(--card);font-size:13px;padding:0 34px 0 16px}
.hero{position:relative;overflow:hidden;border-radius:var(--r-l);padding:22px;color:var(--on-acc);background:linear-gradient(140deg,var(--navy) 10%,var(--acc-2));box-shadow:0 18px 40px -18px var(--acc);display:flex;flex-direction:column;gap:14px;min-height:230px}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;border:1.5px solid rgba(255,255,255,.22)}
.hero::before{width:260px;height:260px;right:-90px;top:-110px}
.hero::after{width:180px;height:180px;right:-30px;top:-60px;background:rgba(255,255,255,.08)}
.hero-top{display:flex;align-items:center;justify-content:space-between;position:relative}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:500;opacity:.85}
.glass{display:inline-flex;align-items:center;height:26px;padding:0 11px;border-radius:999px;background:rgba(255,255,255,.18);font-size:12px}
.hero-num{position:relative;font-family:var(--f-disp);font-weight:800;font-size:44px;line-height:1;letter-spacing:-.02em}
.hero-num small{font-size:20px;opacity:.75;font-weight:600}
.hero-meta{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:auto;padding-top:14px;border-top:1px dashed rgba(255,255,255,.3)}
.hero-meta small{display:block;font-size:11px;opacity:.75}
.hero-meta b{font-family:var(--f-disp);font-size:17px;font-weight:700}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.kpi{display:flex;flex-direction:column;gap:10px;padding:18px 20px}
.kpi-h{display:flex;align-items:center;gap:10px;color:var(--ink-2);font-size:13px}
.kpi-h .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center}
.kpi-h .ic svg{width:17px;height:17px}
.kpi-v{font-family:var(--f-disp);font-weight:700;font-size:30px;line-height:1;letter-spacing:-.01em}
.kpi-s{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:12px;flex-wrap:wrap}
.chart{position:relative;height:210px;display:flex;gap:10px;align-items:flex-end;padding-left:44px;padding-bottom:26px}
.chart .gl{position:absolute;left:44px;right:0;height:0;border-top:1px dashed var(--line)}
.chart .gl span{position:absolute;left:-44px;top:-8px;width:38px;text-align:right;font-size:11px;color:var(--mute)}
.col{position:relative;flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0}
.bar{width:min(46px,100%);border-radius:999px;background:repeating-linear-gradient(-45deg,var(--acc-soft) 0 6px,color-mix(in srgb,var(--acc-soft) 70%,var(--acc-2)) 6px 8px);min-height:6px;transition:height .4s}
.col.hl .bar{background:linear-gradient(180deg,var(--acc-2),var(--acc))}
.col .x{position:absolute;bottom:-24px;font-size:11.5px;color:var(--mute);white-space:nowrap}
.col.hl .x{color:var(--ink);font-weight:500}
.tip{position:absolute;background:var(--acc);color:var(--on-acc);font-size:11px;font-weight:500;padding:3px 9px;border-radius:999px;white-space:nowrap}
.donut{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut svg{width:150px;height:150px;flex:none}
.legend{display:grid;gap:12px;flex:1;min-width:140px}
.legend div{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2)}
.legend i{width:10px;height:10px;border-radius:3px}
.legend b{margin-left:auto;font-family:var(--f-disp);font-size:16px;color:var(--ink)}
.rows{display:grid}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);min-width:0;text-align:left;width:100%}
.row:first-child{border-top:0}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{display:block;color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .v{font-family:var(--f-disp);font-weight:700;font-size:16px;white-space:nowrap}
button.row:hover .t b{color:var(--acc-txt)}
.pipe{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.pipe button{border-radius:14px;padding:10px;text-align:left;display:grid;gap:2px}
.pipe b{font-family:var(--f-disp);font-size:22px;line-height:1}
.pipe small{font-size:11px;line-height:1.2}
.meter{height:8px;border-radius:99px;background:var(--card-2);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--acc-2))}

/* ---------- listas ---------- */
.list{display:grid;gap:10px}
.prow{display:grid;grid-template-columns:minmax(0,2.4fr) 90px 140px 110px 110px 20px;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:12px 16px;text-align:left;width:100%}
.prow:hover{border-color:color-mix(in srgb,var(--acc) 35%,var(--line))}
.prow .who{display:flex;align-items:center;gap:12px;min-width:0}
.prow .who div{min-width:0}
.prow .who b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .who small{display:block;color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .m{font-family:var(--f-disp);font-weight:700;font-size:16px;text-align:right}
.prow .sd{text-align:right;font-size:13px}
.prow svg.ch{width:16px;height:16px;color:var(--mute)}
.lhead{display:grid;grid-template-columns:minmax(0,2.4fr) 90px 140px 110px 110px 20px;gap:14px;padding:0 16px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.lhead span:nth-child(4),.lhead span:nth-child(5){text-align:right}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.ccard{background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);padding:16px;text-align:left;display:grid;gap:12px;box-shadow:var(--shadow);width:100%}
.ccard:hover{border-color:color-mix(in srgb,var(--acc) 35%,var(--line))}
.ccard-h{display:flex;gap:12px;align-items:center;min-width:0}
.ccard-h div{min-width:0}
.ccard-h b{display:block;font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccard-h small{color:var(--mute);font-size:12px}
.tags{display:flex;gap:6px;flex-wrap:wrap;min-height:24px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--card-2);border-radius:14px;padding:10px 12px}
.stats3 small{display:block;font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.stats3 b{font-family:var(--f-disp);font-size:16px;font-weight:700}
.srow{display:grid;grid-template-columns:minmax(0,1.6fr) 80px 70px 70px 80px 90px;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px 16px;text-align:left;width:100%}
.srow:hover{border-color:color-mix(in srgb,var(--acc) 35%,var(--line))}
.srow .n b{display:block;font-weight:500}
.srow .n small{display:block;color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .c{text-align:center;font-size:13px}
.srow .r{text-align:right}
.badge{display:inline-grid;place-items:center;min-width:34px;height:28px;padding:0 9px;border-radius:10px;font-family:var(--f-disp);font-weight:700;font-size:15px}
.shead{display:grid;grid-template-columns:minmax(0,1.6fr) 80px 70px 70px 80px 90px;gap:12px;padding:0 16px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.shead span{text-align:center}.shead span:first-child{text-align:left}.shead span:last-child{text-align:right}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.strip .card{padding:16px 18px}
.strip small{display:block;color:var(--mute);font-size:12px;margin-bottom:6px}
.strip b{font-family:var(--f-disp);font-size:24px;font-weight:700}
.dual{display:flex;gap:4px;align-items:flex-end;height:100%;width:min(70px,100%);justify-content:center}
.dual i{flex:1;border-radius:999px;min-height:6px}
.dual i.a{background:linear-gradient(180deg,var(--ok),color-mix(in srgb,var(--ok) 60%,var(--card)))}
.dual i.b{background:repeating-linear-gradient(-45deg,var(--bad-soft) 0 6px,color-mix(in srgb,var(--bad-soft) 60%,var(--bad)) 6px 8px)}

/* ---------- panel lateral / hoja ---------- */
.ov{position:fixed;inset:0;z-index:60}
.scrim{position:absolute;inset:0;background:rgba(16,12,40,.38);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fade .2s}
.sheet{position:absolute;top:16px;right:max(16px,env(safe-area-inset-right,0px));bottom:16px;width:min(500px,calc(100% - 32px));background:var(--bg);border:1px solid var(--line);border-radius:var(--r-l);overflow:auto;box-shadow:0 30px 80px -20px rgba(20,10,60,.4);animation:slide .25s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
.sh-h{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;padding:18px 20px;background:var(--bg);border-bottom:1px solid var(--line)}
.sh-h h2{flex:1;font-size:21px;font-weight:700;min-width:0}
.sh-h h2 small{display:block;font-family:var(--f-body);font-size:12px;font-weight:400;color:var(--mute)}
.sh-b{padding:18px 20px 28px;display:grid;gap:16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:16px}
.box h4{margin:0 0 10px;font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:14px}
.kv.big{font-family:var(--f-disp);font-size:20px;font-weight:700;border-top:1px dashed var(--line);margin-top:6px;padding-top:10px}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.steps button{display:grid;gap:6px;justify-items:center;font-size:11px;color:var(--mute);text-align:center;line-height:1.2}
.steps button i{width:100%;height:6px;border-radius:99px;background:var(--card-2)}
.steps button.on i{background:var(--acc)}
.steps button.cur{color:var(--ink);font-weight:500}
.it{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.it:first-child{border-top:0}
.it .t b{display:block;font-weight:500}
.it .t small{color:var(--mute);font-size:12px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--card-2)}
.qty button{width:30px;height:30px;display:grid;place-items:center;color:var(--ink-2)}
.qty span{min-width:20px;text-align:center;font-weight:500}
.it input.in{width:98px;height:36px;font-size:14px;padding:0 10px;border-radius:10px;text-align:right}
.it select.in{width:96px;height:36px;font-size:13px;padding:0 8px;border-radius:10px}
.pick-list{display:grid;gap:4px;max-height:236px;overflow:auto;margin-top:8px;padding-right:2px}
.pk{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;background:var(--card-2);text-align:left}
.pk:hover{background:var(--acc-soft)}
.pk b{font-weight:500;min-width:84px}
.pk span{flex:1;color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk em{font-style:normal;font-size:12px}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--card-2);font-size:13px;color:var(--ink-2)}
.opt[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.wa{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--ok-soft);color:var(--ok);text-decoration:none;font-size:13.5px;font-weight:500}
.wa svg{width:18px;height:18px}
.contact{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (min-width:900px){.toast{bottom:28px}}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
body.lock{overflow:hidden}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .s4{grid-column:span 6}.s8{grid-column:span 12}
  .dash > .hero{grid-column:span 12}
  .dash > .kpis{grid-column:span 12}
  .kpis{grid-template-columns:repeat(4,1fr)}
}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .main{padding-block:14px calc(110px + env(safe-area-inset-bottom,0px))}
  .mbrand{display:flex;align-items:center;gap:8px;width:100%;margin-bottom:4px}
  .mbrand b{font-family:var(--f-disp);font-size:20px;font-weight:800;flex:1}
  .mbrand b em{font-style:normal;color:var(--acc)}
  .top{margin-bottom:16px}
  .top-t h1{font-size:25px}
  .top-r .btn{display:none}
  .top-r .status{display:none}
  .bnav{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line)}
  .bnav a,.bnav button{display:grid;justify-items:center;gap:3px;font-size:10.5px;color:var(--mute);text-decoration:none;padding:4px 0}
  .bnav svg{width:22px;height:22px}
  .bnav a[aria-current="page"]{color:var(--acc-txt)}
  .bnav .plus span{width:46px;height:46px;border-radius:16px;margin-top:-20px;display:grid;place-items:center;background:linear-gradient(140deg,var(--acc),var(--acc-2));color:var(--on-acc);box-shadow:0 10px 20px -8px var(--acc)}
  .s4,.s6,.s8,.s12{grid-column:span 12}
  .dash{gap:14px}
  .kpis{grid-template-columns:1fr 1fr;gap:14px}
  .hero-num{font-size:38px}
  .sheet{top:auto;left:0;right:0;bottom:0;width:100%;max-height:92%;border-radius:var(--r-l) var(--r-l) 0 0;border-bottom:0;animation:up .28s cubic-bezier(.2,.8,.2,1)}
  .sh-h{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
  .sh-b{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
  .lhead,.shead{display:none}
  .prow{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"who m" "est sd";row-gap:8px;padding:12px 14px}
  .prow .who{grid-area:who}.prow .m{grid-area:m}.prow .est{grid-area:est}.prow .sd{grid-area:sd}
  .prow .fe,.prow svg.ch{display:none}
  .srow{grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"n st p" "n sub sub"}
  .srow .n{grid-area:n}.srow .stc{grid-area:st}.srow .r{grid-area:p}
  .srow .gc,.srow .vc,.srow .cc{display:none}
  .srow .sub{display:block;grid-area:sub;text-align:right;font-size:11.5px;color:var(--mute)}
  .strip{grid-template-columns:1fr 1fr}
  .in,.sel{font-size:16px}
}
.srow .sub{display:none}
@media (max-width:420px){.hero-meta b{font-size:15px}.kpi-v{font-size:24px}.pipe b{font-size:19px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

function emptyDB(){const o={};Object.keys(KEY).forEach(k=>o[k]=[]);return o}
function applyOp(db,op){
  const arr=db[op.t]||(db[op.t]=[]),k=KEY[op.t];
  if(op.op==='add')arr.push(Object.assign({},op.row));
  else if(op.op==='update'){const r=arr.find(x=>String(x[k])===String(op.key));if(r)Object.assign(r,op.set);else if(op.upsert)arr.push(Object.assign({},op.set,{[k]:op.key}))}
  else if(op.op==='delete'){const i=arr.findIndex(x=>String(x[k])===String(op.key));if(i>=0)arr.splice(i,1)}
  else if(op.op==='deleteWhere'){db[op.t]=arr.filter(x=>String(x[op.col])!==String(op.val))}
}
function rebuild(){
  S=JSON.parse(JSON.stringify(base||emptyDB()));
  Object.keys(KEY).forEach(k=>{if(!Array.isArray(S[k]))S[k]=[]});
  outbox.forEach(op=>applyOp(S,op));
  S.Pedidos.forEach(p=>{p.id=String(p.id);p.descuento=num(p.descuento);p.envio=num(p.envio);p.fecha=p.fecha||'';p.cliente=String(p.cliente||'').trim()});
  S.Items.forEach(i=>{i.pedido=String(i.pedido);i.cantidad=num(i.cantidad)||0;i.precio=num(i.precio);i.cuenta_stock=bool(i.cuenta_stock);i.codigo=String(i.codigo)});
  S.Cobros.forEach(c=>{c.pedido=String(c.pedido);c.monto=num(c.monto);c.fecha=c.fecha||''});
  S.Clientes.forEach(c=>{c.nombre=String(c.nombre).trim();c.telefono=String(c.telefono||'');c.cumple=String(c.cumple||'')});
  S.Catalogo.forEach(p=>{p.codigo=String(p.codigo);p.precio=num(p.precio);p.costo_lista=num(p.costo_lista);p.stock_inicial=num(p.stock_inicial);p.tester=bool(p.tester);p.activo=p.activo===''||p.activo===undefined?true:bool(p.activo)});
  S.Compras.forEach(c=>{c.numero=String(c.numero);c.total=num(c.total);c.envio=num(c.envio);c.testers=num(c.testers)});
  S.CompraItems.forEach(x=>{x.compra=String(x.compra);x.codigo=String(x.codigo);x.cantidad=num(x.cantidad);x.precio=num(x.precio);x.cuenta_stock=bool(x.cuenta_stock)});
  D=derive();
}
function cfgVal(k,d){const r=S.Config.find(x=>x.clave===k);return r&&r.valor!==''?r.valor:d}
function commit(ops,msg){
  if(demo)ops.forEach(op=>applyOp(base,op));
  else{outbox.push(...ops);LS.set('nota.outbox',outbox)}
  rebuild();render();if(msg)toast(msg);
  if(!demo)push();
}
async function push(){
  if(demo||busy||!outbox.length)return;
  busy=true;setStatus();const ops=outbox.slice();
  try{
    const r=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({pin:cfg.pin,ops})});
    const j=await r.json();if(!j.ok)throw new Error(j.error||'Error');
    outbox.splice(0,ops.length);LS.set('nota.outbox',outbox);syncErr='';
  }catch(e){syncErr=String(e.message||e)}
  busy=false;
  if(!syncErr&&!outbox.length)await pull();
  else{setStatus();if(syncErr)setTimeout(push,20000)}
}
async function pull(){
  if(demo||!cfg.url)return;
  if(outbox.length){push();return}
  busy=true;setStatus();
  try{
    const r=await fetch(cfg.url+(cfg.url.includes('?')?'&':'?')+'pin='+encodeURIComponent(cfg.pin));
    const j=await r.json();if(!j.ok)throw new Error(j.error||'Error');
    base=j.data;LS.set('nota.base',base);lastSync=Date.now();LS.set('nota.last',lastSync);syncErr='';
    rebuild();const a=document.activeElement;if(!(a&&$('#view').contains(a)&&a.tagName==='INPUT'))renderView();
  }catch(e){syncErr=String(e.message||e)}
  busy=false;setStatus();
}
function setStatus(){
  const el=$('#status');let cls='',txt='';
  if(demo){cls='demo';txt='Datos de ejemplo'}
  else if(busy){cls='busy';txt=outbox.length?'Guardando…':'Actualizando…'}
  else if(syncErr){cls='err';txt=outbox.length?`Sin conexión · ${outbox.length} pendiente${outbox.length>1?'s':''}`:'Sin conexión'}
  else{txt=lastSync?'Al día':'Conectada'}
  el.className='status '+cls;el.innerHTML=`<i></i>${txt}`;
}

/* ================== cálculos ================== */
function derive(){
  const d={prod:{},itemsBy:{},cobBy:{},ped:{},stock:{},camino:{},vend:{},cli:{}};
  S.Catalogo.forEach(p=>{d.prod[p.codigo]=p;d.stock[p.codigo]=p.stock_inicial;d.camino[p.codigo]=0;d.vend[p.codigo]=0});
  const ens=c=>{if(!(c in d.stock)){d.stock[c]=0;d.camino[c]=0;d.vend[c]=0}};
  S.Items.forEach(i=>(d.itemsBy[i.pedido]=d.itemsBy[i.pedido]||[]).push(i));
  S.Cobros.forEach(c=>(d.cobBy[c.pedido]=d.cobBy[c.pedido]||[]).push(c));
  d.comp={};let U=0,CP=0,EN=0,TE=0;
  S.Compras.forEach(c=>{const its=S.CompraItems.filter(x=>x.compra===c.numero);const u=its.filter(x=>x.tipo!=='Tester').reduce((s,x)=>s+x.cantidad,0);const cp=u>0?Math.max(c.total-c.testers,0):0,te=u>0?c.testers:c.total;d.comp[c.numero]={u,cp,te,envU:u?c.envio/u:0,prodU:u?(cp-c.envio)/u:0};U+=u;CP+=cp;if(u)EN+=c.envio;TE+=te});
  const lista=S.Catalogo.filter(p=>p.genero!=='Otro'&&p.costo_lista>0);
  d.costo=U&&CP?CP/U:(lista.length?lista.reduce((s,p)=>s+p.costo_lista,0)/lista.length:0);
  d.envioU=U?EN/U:0;d.prodU=d.costo-d.envioU;d.testersInv=TE;
  S.CompraItems.forEach(x=>{if(x.tipo==='Tester')return;ens(x.codigo);if(x.estado==='Recibido'&&x.cuenta_stock)d.stock[x.codigo]+=x.cantidad;if(x.estado==='En camino')d.camino[x.codigo]+=x.cantidad});
  S.Items.forEach(i=>{ens(i.codigo);d.vend[i.codigo]+=i.cantidad;if(i.cuenta_stock)d.stock[i.codigo]-=i.cantidad});
  S.Pedidos.forEach(p=>{
    const its=d.itemsBy[p.id]||[],sub=its.reduce((s,i)=>s+i.cantidad*i.precio,0),total=sub-p.descuento+p.envio;
    const cobs=d.cobBy[p.id]||[],cobrado=cobs.reduce((s,c)=>s+c.monto,0);
    d.ped[p.id]={its,cobs,sub,total,neto:sub-p.descuento,cobrado,saldo:Math.round(total-cobrado),unid:its.reduce((s,i)=>s+i.cantidad,0),txt:its.map(i=>i.codigo+(i.cantidad>1?' x'+i.cantidad:'')).join(', ')||'Sin productos'};
  });
  S.Clientes.forEach(c=>d.cli[c.nombre]={c,peds:[],comprado:0,saldo:0,ultima:'',cods:{}});
  S.Pedidos.forEach(p=>{
    if(!d.cli[p.cliente])d.cli[p.cliente]={c:{nombre:p.cliente,telefono:'',ciudad:'',instagram:'',cumple:'',notas:'',desde:p.fecha},peds:[],comprado:0,saldo:0,ultima:'',cods:{},solo:true};
    const x=d.cli[p.cliente],pc=d.ped[p.id];x.peds.push(p);x.comprado+=pc.total;x.saldo+=pc.saldo;if(p.fecha>x.ultima)x.ultima=p.fecha;
    pc.its.forEach(i=>x.cods[i.codigo]=(x.cods[i.codigo]||0)+i.cantidad);
  });
  return d;
}
function costBreak(tot,env,tes,u,sub){
  const cp=u>0?Math.max(tot-tes,0):0;
  let h=sub!==undefined?`<div class="kv muted"><span>Subtotal de lista (${u} perfume${u===1?'':'s'})</span><span class="num">${money(sub)}</span></div>`:'';
  if(!tot)return h+'<p class="muted" style="margin:6px 0 0;font-size:12.5px">Cargá el total pagado para ver cuánto te sale cada perfume.</p>';
  if(!u)return h+`<div class="kv"><span>Todo va a testers / muestras</span><b class="num">${money(tot)}</b></div><p class="muted" style="margin:6px 0 0;font-size:12.5px">No suma al costo de los perfumes que vendés.</p>`;
  return h+(tes?`<div class="kv muted"><span>Testers / kit (inversión aparte)</span><span class="num">−${money(tes)}</span></div>`:'')+`<div class="kv"><span>Costo de los perfumes</span><b class="num">${money(cp)}</b></div><div class="kv big" style="font-size:17px"><span>Cada perfume te sale</span><span class="num">${money(cp/u)}</span></div><div class="kv muted"><span>Producto</span><span class="num">${money((cp-env)/u)}</span></div><div class="kv muted"><span>Envío</span><span class="num">${money(env/u)}</span></div>`;
}
const costItem=i=>{const p=D.prod[i.codigo];return p&&p.genero==='Otro'?p.costo_lista:D.costo};
const mk=f=>(f||'').slice(0,7);
function metrics(per,gen){
  let ventas=0,costo=0,unid=0,cobrado=0,invertido=0;const rank={};
  S.Pedidos.forEach(p=>{
    if(per!=='all'&&mk(p.fecha)!==per)return;
    const pc=D.ped[p.id],f=pc.sub?pc.neto/pc.sub:0;
    pc.its.forEach(i=>{const pr=D.prod[i.codigo];if(gen!=='all'&&(!pr||pr.genero!==gen))return;ventas+=i.cantidad*i.precio*f;costo+=costItem(i)*i.cantidad;unid+=i.cantidad;rank[i.codigo]=(rank[i.codigo]||0)+i.cantidad});
  });
  S.Cobros.forEach(c=>{if(per==='all'||mk(c.fecha)===per)cobrado+=c.monto});
  S.Compras.forEach(c=>{if(per==='all'||mk(c.fecha)===per)invertido+=c.total});
  return{ventas,costo,gan:ventas-costo,margen:ventas?(ventas-costo)/ventas:0,unid,rank,cobrado,invertido,caja:cobrado-invertido};
}
function months(){const s=new Set();S.Pedidos.forEach(p=>p.fecha&&s.add(mk(p.fecha)));S.Cobros.forEach(c=>c.fecha&&s.add(mk(c.fecha)));S.Compras.forEach(c=>c.fecha&&s.add(mk(c.fecha)));return[...s].sort()}
const porCobrar=()=>Object.values(D.ped).reduce((s,p)=>s+(p.saldo>0?p.saldo:0),0);
const deudores=()=>Object.values(D.cli).filter(x=>x.saldo>0).sort((a,b)=>b.saldo-a.saldo);
function niceMax(x){if(x<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(x)));for(const m of[1,1.5,2,2.5,3,4,5,6,8,10])if(m*p>=x)return m*p;return 10*p}
function nextPid(){let m=0;S.Pedidos.forEach(p=>{const n=parseInt(String(p.id).replace(/\D/g,''),10);if(n>m)m=n});return 'V-'+String(m+1).padStart(3,'0')}
function stockTone(n){return n>0?'t-ok':n<0?'t-bad':'t-mute'}
function segs(x){const t=[];if(x.saldo>0)t.push(['Debe '+kmoney(x.saldo),'t-bad']);if(x.peds.length>=3)t.push(['Frecuente','t-acc']);if(x.c.desde&&daysAgo(x.c.desde)<=30)t.push(['Nueva','t-info']);if(x.ultima&&daysAgo(x.ultima)>60)t.push(['Para reactivar','t-warn']);if(cumpleEn(x.c.cumple)<=15)t.push(['Cumple pronto','t-ok']);return t}
function cumpleEn(c){const m=String(c||'').match(/(\d{1,2})\/(\d{1,2})/);if(!m)return 999;const n=new Date();n.setHours(0,0,0,0);let d=new Date(n.getFullYear(),+m[2]-1,+m[1]);if(d<n)d=new Date(n.getFullYear()+1,+m[2]-1,+m[1]);return Math.round((d-n)/864e5)}

/* ================== mensajes de WhatsApp ================== */
function waHref(tel,text){let d=String(tel||'').replace(/\D/g,'');if(d.startsWith('0'))d=d.slice(1);if(d.length===10)d='549'+d;else if(d.startsWith('54')&&!d.startsWith('549'))d='549'+d.slice(2);return 'https://wa.me/'+(d||'')+'?text='+encodeURIComponent(text||'')}
function fillTpl(t,nombre,pedId){
  const x=D.cli[nombre];const pc=pedId?D.ped[pedId]:null;
  const perf=pc?pc.its.map(i=>{const p=D.prod[i.codigo];return p&&p.genero!=='Otro'?`${i.codigo} (${p.inspirado})`:i.codigo}).join(', '):'';
  return String(t||'').replace(/{{\s*nombre\s*}}/g,first(nombre)).replace(/{{\s*perfumes\s*}}/g,perf).replace(/{{\s*saldo\s*}}/g,money(pc?pc.saldo:(x?x.saldo:0)));
}
function tpl(match){const m=S.Mensajes.find(x=>norm(x.nombre).includes(match));return m?m.texto:''}
function waList(nombre,pedId){
  const x=D.cli[nombre];const tel=x?x.c.telefono:'';
  if(!S.Mensajes.length)return `<p class="muted" style="margin:0">Cargá plantillas en Ajustes para escribir con un toque.</p>`;
  return `<div style="display:grid;gap:8px">${S.Mensajes.map(m=>`<a class="wa" target="_blank" rel="noopener" href="${esc(waHref(tel,fillTpl(m.texto,nombre,pedId)))}">${ic('wa')}<span style="flex:1">${esc(m.nombre)}</span>${ic('chev',16)}</a>`).join('')}</div>${tel?'':'<p class="muted" style="margin:8px 0 0;font-size:12px">Sin teléfono cargado: WhatsApp te va a pedir elegir el contacto.</p>'}`;
}

  const gl=[1,.5,0].map(f=>`<div class="gl" style="bottom:${26+f*(184-26)}px"><span>${kmoney(max*f)}</span></div>`).join('');
  return `<div class="chart">${gl}${series.map(s=>`<div class="col${s.k===hlKey?' hl':''}">${s.k===hlKey?`<span class="tip num" style="bottom:${Math.max(s.v/max*158,6)+8}px">${(fmt||kmoney)(s.v)}</span>`:''}<div class="bar" style="height:${Math.max(s.v/max*158,6)}px" title="${esc(mlabel(s.k)+': '+money(s.v))}"></div><span class="x">${mlabel(s.k)}</span></div>`).join('')}</div>`;
}

  const kpi=(icn,t,lab,val,sub)=>`<article class="card kpi"><div class="kpi-h"><span class="ic ${t}">${ic(icn)}</span>${lab}</div><div class="kpi-v num">${val}</div><div class="kpi-s">${sub}</div></article>`;
  const deu=deudores();

  const ser=ms.slice(-6).map(k=>{const x=metrics(k,V.gen);return{k,v:V.chart==='ventas'?x.ventas:V.chart==='gan'?x.gan:x.cobrado}});
  const hl=V.per!=='all'&&ms.includes(V.per)?V.per:(ser.length?ser[ser.length-1].k:'');
  const sb=(k,l)=>`<button data-a="chart" data-v="${k}" aria-pressed="${V.chart===k}">${l}</button>`;

  <div class="box"><h4>Montos del mail de Leduft</h4><div style="display:grid;gap:12px"><div class="field"><label class="lbl" for="oTot">Total pagado $ (con descuentos y envío)</label><input class="in num" id="oTot" data-f="oCalc" inputmode="numeric" placeholder="Lo que salió de tu cuenta"></div><div class="grid2"><div class="field"><label class="lbl" for="oEnv">De eso, envío $</label><input class="in num" id="oEnv" data-f="oCalc" inputmode="numeric" placeholder="0"></div><div class="field"><label class="lbl" for="oTes">De eso, testers / kit $</label><input class="in num" id="oTes" data-f="oCalc" inputmode="numeric" placeholder="0"></div></div><div id="fTot"></div></div></div>

  <button class="btn block" data-a="saveCompra" style="height:48px">${ic('check')}Guardar compra</button>`);
  drawItems();filterPick('');
}
function saveCompra(){
  const n=$('#oNum').value.trim(),tot=num($('#oTot').value);
  if(!n){toast('Falta el número de pedido');return}if(S.Compras.find(c=>c.numero===n)){toast('Esa compra ya está cargada');return}
  if(!tot){toast('Falta el total pagado');return}
  const est=$('#oEst [aria-pressed="true"]').textContent,fec=$('#oFec').value;
  const ops=[{op:'add',t:'Compras',row:{numero:n,fecha:fec,estado:est,total:tot,envio:num($('#oEnv').value),testers:num($('#oTes').value),recibido:est==='Recibido'?fec:'',notas:$('#oNot').value.trim()}}];
  F.items.forEach(i=>ops.push({op:'add',t:'CompraItems',row:{id:'CI-'+uid(),compra:n,codigo:i.codigo,tipo:i.tipo||'Perfume',cantidad:i.cantidad,precio:num(i.precio),estado:est,cuenta_stock:true}}));
  closeSheet();commit(ops,'Compra guardada');
}

/* --- ajustes --- */
function sheetAjustes(){
  F={kind:'ajustes'};
  openSheet('Ajustes y conexión','',`
  <div class="box"><h4>Tu planilla de Google</h4><div style="display:grid;gap:12px"><div class="field"><label class="lbl" for="aPin">Clave</label><input class="in" id="aPin" type="password" value="${esc(cfg.pin)}" placeholder="La que elegiste en la planilla" autocomplete="off"></div><details><summary class="muted" style="font-size:12.5px;cursor:pointer">Dirección de la planilla (no hace falta tocarla)</summary><input class="in" id="aUrl" value="${esc(cfg.url)}" autocomplete="off" style="margin-top:8px;font-size:13px"></details><div class="field"><label class="lbl" for="aNom">Tu nombre (para el saludo)</label><input class="in" id="aNom" value="${esc(cfg.nombre)}" placeholder="Opcional"></div><button class="btn block" data-a="saveCfg">${ic('check')}Guardar y conectar</button>${!demo?`<button class="btn ghost block" data-a="syncNow">${ic('refresh')}Actualizar ahora</button>`:''}<p class="muted" style="margin:0;font-size:12.5px" id="aMsg">${demo?'Escribí la clave que configuraste en la planilla y tocá Guardar y conectar.':syncErr?'Último error: '+esc(syncErr):lastSync?'Última actualización: '+new Date(lastSync).toLocaleString('es-AR'):''}${outbox.length?` · ${outbox.length} cambio(s) esperando para guardarse`:''}</p></div></div>
  <div class="box"><h4>Reponer</h4><div class="field"><label class="lbl" for="aUm">Avisarme cuando queden (stock + en camino) ≤</label><input class="in num" id="aUm" inputmode="numeric" value="${num(cfgVal('umbral_reponer',0))}"></div><button class="btn soft sm" style="margin-top:10px" data-a="saveUm">Guardar</button></div>
  <div class="box"><h4>Mensajes de WhatsApp</h4><p class="muted" style="margin:0 0 10px;font-size:12.5px">Usá {{nombre}}, {{perfumes}} y {{saldo}}: se completan solos.</p><div class="rows">${S.Mensajes.map(m=>`<button class="row" data-a="editMsj" data-v="${esc(m.nombre)}"><div class="t"><b>${esc(m.nombre)}</b><small>${esc(m.texto)}</small></div>${ic('chev',16)}</button>`).join('')}</div><button class="btn soft sm" style="margin-top:10px" data-a="editMsj" data-v="">${ic('plus')}Nueva plantilla</button></div>
  ${demo?'':`<button class="btn ghost block" data-a="goDemo">Ver datos de ejemplo</button>`}`);
}
function formMsj(n){
  const m=n?S.Mensajes.find(x=>x.nombre===n):null;F={kind:'msj',n:n||null};
  openSheet(n?'Editar plantilla':'Nueva plantilla','',`<div class="field"><label class="lbl" for="mNom">Nombre</label><input class="in" id="mNom" value="${esc(m?m.nombre:'')}" ${n?'disabled':''} placeholder="Ej: Ya llegó"></div><div class="field"><label class="lbl" for="mTxt">Mensaje</label><textarea class="in" id="mTxt" style="min-height:160px">${esc(m?m.texto:'Hola {{nombre}}! ')}</textarea></div><button class="btn block" data-a="saveMsj">${ic('check')}Guardar</button>${n?`<button class="btn danger block" data-a="delMsj" data-v="${esc(n)}">${ic('trash')}Eliminar</button>`:''}`);

/* ================== acciones ================== */
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2400)}
const reopen=()=>{if(!F)return;if(F.kind==='verPedido')sheetPedido(F.id);else if(F.kind==='verCliente')sheetCliente(F.n);else if(F.kind==='verCompra')sheetCompra(F.n)};
const ACT={
  close:()=>closeSheet(),
  settings:()=>sheetAjustes(),
  newPedido:()=>formPedido(),
  newPedidoFor:v=>formPedido(null,v),
  editPedido:v=>formPedido(v),
  newCliente:()=>formCliente(),
  editCliente:v=>formCliente(v),
  newProd:()=>formProd(),
  newCompra:()=>formCompra(),
  ped:v=>sheetPedido(v),
  cli:v=>sheetCliente(v),
  prod:v=>formProd(v),
  compra:v=>sheetCompra(v),
  chart:v=>{V.chart=v;renderView()},
  goPed:v=>{V.pf=v;V.pq='';location.hash='pedidos';if(V.view==='pedidos')renderView()},
  pf:v=>{V.pf=v;document.querySelectorAll('[data-a="pf"]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v));filterPed()},
  cf:v=>{V.cf=v;document.querySelectorAll('[data-a="cf"]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v));filterCli()},
  sg:v=>{V.sg=v;document.querySelectorAll('[data-a="sg"]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v));filterStock()},
  sonly:(v,el)=>{V.sonly=!V.sonly;el.setAttribute('aria-pressed',V.sonly);filterStock()},
  opt:(v,el)=>{const g=el.parentElement;if(g.classList.contains('opts')&&g.id){g.querySelectorAll('.opt').forEach(b=>b.setAttribute('aria-pressed',b===el))}else el.setAttribute('aria-pressed',el.getAttribute('aria-pressed')!=='true')},
  optMet:(v,el)=>{F.metodo=v;el.parentElement.querySelectorAll('.opt').forEach(b=>b.setAttribute('aria-pressed',b===el))},
  pagoTodo:()=>{const t=F.items.reduce((s,i)=>s+i.cantidad*i.precio,0)-num(F.descuento)+num(F.envio);F.pago=t;$('#fPago').value=t},
  pickAdd:v=>{const p=D.prod[v];const ex=F.items.find(i=>i.codigo===v&&(F.kind!=='compra'||i.tipo==='Perfume'));if(ex)ex.cantidad++;else F.items.push(F.kind==='compra'?{codigo:v,cantidad:1,precio:p?p.costo_lista:0,tipo:'Perfume'}:{codigo:v,cantidad:1,precio:p?p.precio:0});drawItems();toast(v+' agregado')},
  qty:(v,el)=>{const i=F.items[+v];i.cantidad+=+el.dataset.d;if(i.cantidad<=0)F.items.splice(+v,1);drawItems()},
  savePedido:()=>savePedido(),
  saveCliente:()=>saveCliente(),
  saveProd:()=>saveProd(),
  saveCompra:()=>saveCompra(),
  setEst:v=>{commit([{op:'update',t:'Pedidos',key:F.id,set:{estado:v}}],'Estado: '+v);reopen()},
  addCobro:v=>{const m=num($('#cbM').value);if(m<=0){toast('Poné un monto');return}const met=$('#cbMet [aria-pressed="true"]');commit([{op:'add',t:'Cobros',row:{id:'C-'+uid(),pedido:v,fecha:$('#cbF').value||today(),monto:m,metodo:met?met.textContent:'Otro',nota:''}}],'Cobro registrado');reopen()},
  delCobro:(v,el)=>arm(el,()=>{commit([{op:'delete',t:'Cobros',key:v}],'Cobro borrado');reopen()}),
  delPedido:(v,el)=>arm(el,()=>{closeSheet();commit([{op:'delete',t:'Pedidos',key:v},{op:'deleteWhere',t:'Items',col:'pedido',val:v},{op:'deleteWhere',t:'Cobros',col:'pedido',val:v}],'Pedido eliminado')}),
  delCliente:(v,el)=>arm(el,()=>{closeSheet();commit([{op:'delete',t:'Clientes',key:v}],'Clienta eliminada')}),
  recibir:v=>{const ops=[{op:'update',t:'Compras',key:v,set:{estado:'Recibido',recibido:today()}}];S.CompraItems.filter(x=>x.compra===v).forEach(x=>ops.push({op:'update',t:'CompraItems',key:x.id,set:{estado:'Recibido'}}));commit(ops,'Compra recibida: stock actualizado');reopen()},
  delCompra:(v,el)=>arm(el,()=>{closeSheet();commit([{op:'delete',t:'Compras',key:v},{op:'deleteWhere',t:'CompraItems',col:'compra',val:v}],'Compra eliminada')}),
  copy:v=>{try{navigator.clipboard.writeText(v).then(()=>toast('Copiado'),()=>toast(v))}catch(e){toast(v)}},
  saveCfg:async()=>{
    const url=$('#aUrl').value.trim()||URL_PLANILLA,pin=$('#aPin').value.trim(),nom=$('#aNom').value.trim();
    if(!pin){$('#aMsg').textContent='Escribí la clave.';return}
    cfg.nombre=nom;
    if(!url){LS.set('nota.cfg',cfg);render();toast('Guardado');return}
    if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)){$('#aMsg').textContent='La dirección tiene que empezar con https://script.google.com/…';return}
    $('#aMsg').textContent='Probando conexión…';
    try{const r=await fetch(url+'?pin='+encodeURIComponent(pin));const j=await r.json();if(!j.ok)throw new Error(j.error);
      cfg={url,pin,nombre:nom};LS.set('nota.cfg',cfg);demo=false;base=j.data;outbox=[];LS.set('nota.base',base);LS.set('nota.outbox',outbox);lastSync=Date.now();LS.set('nota.last',lastSync);syncErr='';
      rebuild();closeSheet();render();toast('Conectada a tu planilla');
    }catch(e){$('#aMsg').textContent='No pude conectar: '+(e.message||e)+'. Revisá la dirección y la clave.'}
  },
  syncNow:()=>{pull();toast('Actualizando…')},
  saveUm:()=>{commit([{op:'update',t:'Config',key:'umbral_reponer',set:{valor:num($('#aUm').value)},upsert:true}],'Guardado');},
  goDemo:()=>{demo=true;base=demoData();outbox=[];rebuild();closeSheet();render();toast('Mostrando datos de ejemplo')},
  editMsj:v=>formMsj(v),
  saveMsj:()=>{const n=F.n||$('#mNom').value.trim(),t=$('#mTxt').value;if(!n){toast('Falta el nombre');return}const ops=F.n?[{op:'update',t:'Mensajes',key:n,set:{texto:t}}]:[{op:'add',t:'Mensajes',row:{nombre:n,texto:t}}];commit(ops,'Plantilla guardada');sheetAjustes()},
  delMsj:(v,el)=>arm(el,()=>{commit([{op:'delete',t:'Mensajes',key:v}],'Plantilla eliminada');sheetAjustes()})
};
document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(!a)return;const fn=ACT[a.dataset.a];if(fn){e.preventDefault();fn(a.dataset.v,a,e)}});
const INP={
  pq:el=>{V.pq=el.value;filterPed()},cq:el=>{V.cq=el.value;filterCli()},sq:el=>{V.sq=el.value;filterStock()},
