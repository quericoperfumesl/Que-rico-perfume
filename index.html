badd:function(i){if(!S.buyCart.filter(function(l){return l.p===i;})[0])S.buyCart.push({p:i,q:1});render();},
bqty:function(i,d){var l=S.buyCart.filter(function(x){return x.p===i;})[0];l.q=Math.max(1,l.q+d);render();},
saveBuy:function(){var t=S.buyCart.reduce(function(s,l){return s+prod(l.p).cost*l.q;},0);S.buys.unshift({id:uid(),date:TODAY,lines:S.buyCart.map(function(l){return{p:l.p,q:l.q,c:prod(l.p).cost};}),total:t});S.buyCart.forEach(function(l){prod(l.p).stock+=l.q;});S.ov=null;S.view="caja";render();},
mktab:function(t){S.mktab=t;S.editTpl=null;render();},mseg:function(s){S.mseg=s;render();},mtpl:function(t){S.mtid=t;render();},
wsend:function(ph,msg){window.open("https://wa.me/"+ph+"?text="+msg,"_blank");},
tedit:function(id){S.editTpl=id;render();},tnew:function(){var id="t"+Date.now();T.push({id:id,name:"Nueva plantilla",body:"Hola {{nombre}}! "});S.editTpl=id;render();},tcancel:function(){S.editTpl=null;render();},
tsave:function(id){var t=T.filter(function(x){return x.id===id;})[0];t.name=document.getElementById("tplname").value||t.name;t.body=document.getElementById("tpltext").value;S.editTpl=null;render();},
insVar:function(v){var ta=document.getElementById("tpltext");if(!ta)return;var s=ta.selectionStart||ta.value.length;ta.value=ta.value.slice(0,s)+v+ta.value.slice(ta.selectionEnd||s);ta.focus();ta.selectionStart=ta.selectionEnd=s+v.length;},
uedit:function(id){S.editUser=id;render();},unew:function(){var id="u"+Date.now();U.push({id:id,name:"Nuevo usuario",role:"Ventas"});S.editUser=id;render();},ucancel:function(){S.editUser=null;render();},
usave:function(id){var u=U.filter(function(x){return x.id===id;})[0];u.name=document.getElementById("uname").value||u.name;u.role=document.getElementById("urole").value;S.editUser=null;render();},
wa:function(ph,kind,ex){var d=JSON.parse(decodeURIComponent(ex));var t={listo:"Hola "+d.name+"! Tu pedido de "+d.prod+" ya esta listo. Avisame cualquier cosa.",saldo:"Hola "+d.name+"! Te recuerdo que quedo un saldo de "+d.saldo+". Cuando puedas lo cerramos!",gracias:"Hola "+d.name+"! Gracias por tu compra."};window.open("https://wa.me/"+ph+"?text="+encodeURIComponent(t[kind]||t.gracias),"_blank");}
};
render();
})();
</script>
